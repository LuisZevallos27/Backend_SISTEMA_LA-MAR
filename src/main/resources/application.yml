spring:
  application:
    name: lamar-backend
  datasource:
    url: "jdbc:sqlserver://localhost:1433;databaseName=LaMarDB;encrypt=true;trustServerCertificate=true"
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  mongodb:
    uri: "${MONGO_URI}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  web:
    error:
      include-message: always
      include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 480
  cors:
    origenes: "http://localhost:5173,http://localhost:3000"

server:
  port: "8080"
