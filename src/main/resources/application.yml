spring:
  application:
    name: lamar-backend
  datasource:
    url: "${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=LaMarDB;encrypt=true;trustServerCertificate=true}"
    username: ${DB_USER:lamar_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SHOW_SQL:false}
  web:
    error:
      include-message: always

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 480
  cors:
    origenes: "${CORS_ORIGENES:http://localhost:5173,http://localhost:3000}"

server:
  port: ${PORT:8080}