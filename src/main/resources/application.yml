spring:
  application:
    name: lamar-backend
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=LaMarDB;encrypt=true;trustServerCertificate=true
    username: ${DB_USER:lamar_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  web:
    error:
      include-message: always

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 480

server:
  port: 8080